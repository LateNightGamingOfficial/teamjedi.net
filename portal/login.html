<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Sign in — JEDI Metrics Portal</title>
<link rel="icon" href="/assets/media/logos/favicon_nexus.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/portal/portal.css" />
</head>
<body>

  <header class="p-bar">
    <a class="p-brand" href="https://teamjedi.net/"><svg viewBox="0 0 321.4 241.18" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Team JEDI"><path d="M50.14,0v7.44h-13.27v38.84h-8.58V7.44h-13.27V0h35.11Z"/><path d="M126.28,0v7.38h-23.17v11.65h22.07v7.67h-22.17v12.14h23.72v7.44h-32.14V0h31.68Z"/><path d="M185.51,46.28h-8.8L196.35,0h9.22l20.07,46.28h-9.22l-5.28-12.62h-15.37l2.95-7.44h9.32l-7.28-17.38-15.24,37.44Z"/><path d="M272.85,46.28V0h8.9l15.7,35.11L312.82,0h8.58v46.28h-7.93V14.05l-12.56,32.23h-7.31l-12.82-32.23v32.23h-7.93Z"/><path d="M28.31,71.87v119.88c0,19.97-8.76,32.4-28.2,32.4h-.11v17.02c30.68-.11,46.53-20.08,46.53-48.2v-121.1h-18.22Z"/><path d="M174.8,71.17h48.94c35.64.18,62.24,21.28,62.24,60.46s-26.6,60.11-62.24,60.11h-48.94v-120.58ZM193.24,87.31v88.3h29.79c25.71,0,43.98-15.6,43.98-43.98s-18.27-44.15-43.98-44.33h-29.79Z"/><rect x="303.17" y="71.88" width="18.22" height="119.16"/><g class="bars"><rect x="63.73" y="71.17" width="93.87" height="15.55"/><rect x="63.73" y="123.68" width="93.87" height="15.55"/><rect x="63.73" y="176.19" width="93.87" height="15.55"/></g></svg><span class="mono">Metrics Portal</span></a>
  </header>

  <main class="login-wrap">
    <form class="login-card" id="loginForm" novalidate>
      <span class="eyebrow mono">Metrics Portal</span>
      <h1 class="display">Sign in</h1>
      <p>See how teamjedi.net is performing: who visits, what they read, and where they come from.</p>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <button class="btn" type="submit">Sign in →</button>
      <div class="form-msg" id="formMsg" role="alert" aria-live="polite"></div>
      <div class="login-foot">Need access? <a href="https://teamjedi.net/contact.html">Contact Team JEDI</a>.</div>
    </form>
  </main>

  <footer class="p-foot"><span>© JEDI</span><a href="https://teamjedi.net/">← Back to teamjedi.net</a></footer>

<script>
  const form = document.getElementById('loginForm');
  const msg = document.getElementById('formMsg');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = form.email.value.trim(), password = form.password.value;
    if (!email || !password) { msg.textContent = 'Enter your email and password.'; return; }
    const btn = form.querySelector('button'); btn.disabled = true; msg.textContent = '';
    try {
      const r = await fetch('/api/portal/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin', body: JSON.stringify({ email, password }),
      });
      const body = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(body.error || 'Sign in failed.');
      location.href = '/dashboard';
    } catch (err) {
      msg.textContent = err.message; form.password.value = ''; form.password.focus();
    } finally { btn.disabled = false; }
  });
</script>
</body>
</html>
